# GitHub runs this only from .github/workflows/collect-news.yml.
# Move this file there and push it with a token that has the workflow scope.
# The token used for this change was refused for that path.

name: Collect compensation news

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-compensation-news
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsx scripts/crawl-news.ts --write

      - run: npx tsx scripts/check-cases.ts

      - name: Commit accepted cases
        run: |
          if git diff --quiet -- src/data/cases.json; then
            echo "No accepted cases. Nothing to commit."
            exit 0
          fi
          git add src/data/cases.json
          git -c user.email="asifvibes@users.noreply.github.com" -c user.name="asifvibes" commit -m "Add compensation reports found by the scheduled crawl."
          git push origin HEAD:main
